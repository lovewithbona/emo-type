<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#DFFF00"><meta name="description" content="감정을 직접 만지는 인터랙티브 타이포그래피 플레이그라운드."><title>EMO.TYPE</title></head><body>
<header class="header"><a class="brand" href="./" aria-label="EMO.TYPE 홈">EMO.TYPE</a><nav aria-label="주요 메뉴"><button id="random">RANDOMIZE</button><button id="reset">RESET</button><button id="export">EXPORT PNG ↓</button><button id="background" aria-label="작품 배경 전환" title="작품 배경 전환">◐</button></nav></header>
<main><section class="playground" aria-label="감정 타이포그래피 작품 영역"><div class="artboard" id="artboard"><svg id="art" viewBox="0 0 1200 720" aria-label="드래그해서 변형하는 감정 타이포그래피" xmlns="http://www.w3.org/2000/svg"><g id="motion"><g id="deform"><g id="type" tabindex="0" role="button" aria-label="글자 변형. 드래그하거나 방향키를 누르세요."></g></g></g></svg></div></section>
<section class="control-dock" aria-label="타이포그래피 컨트롤"><button id="controls-toggle" aria-label="컨트롤 접기" aria-expanded="true" aria-controls="control-body"><span>−</span></button><div id="control-body" class="control-body"><section class="text-control"><div class="text-field"><input id="text-input" aria-label="타이포그래피 문구" value="HOW DO YOU FEEL?" maxlength="80" placeholder="텍스트 입력" autocomplete="off"></div></section><section class="emotion-control"><div id="emotions" class="emotions" role="group" aria-label="감정 선택"></div></section><section class="mode-control"><div id="modes" class="modes" role="group" aria-label="변형 모드"><button data-mode="x" aria-pressed="true" class="selected">STRETCH X</button><button data-mode="y" aria-pressed="false">STRETCH Y</button><button data-mode="free" aria-pressed="false">FREE</button></div></section><section class="intensity-control"><input id="intensity" aria-label="감정 강도" type="range" min="0" max="100" value="65"><output id="intensity-value" for="intensity">65</output></section></div></section></main><div id="toast" role="status"></div><script type="module" src="/src/main.js"></script></body></html>
